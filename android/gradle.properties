# vfork keeps process spawning cheap under QEMU user-mode emulation (ARM64 CI runner).
# NEU (CI-Hygiene): -XX:+HeapDumpOnOutOfMemoryError entfernt. Grund: Bei einem OOM des
# Gradle-Daemons (-Xmx4G) landet ein Heap-Dump von bis zu ~4 GB auf der Disk des
# geteilten Runners (aktuell ~74% voll, Runner-Grenze min_free_disk_space_mb=8192),
# der Job ist trotzdem verloren und der Dump wird nie angeschaut. Der Exit-Code meldet
# den OOM weiterhin. Dev-Rechner koennen den Schalter lokal in ~/.gradle/gradle.properties
# wieder setzen, wenn dort ein Dump gewollt ist.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Djdk.lang.Process.launchMechanism=vfork
android.useAndroidX=true
# Stay on the legacy AGP DSL / external Kotlin plugin until all Flutter plugins
# support the AGP 9 built-in Kotlin (same as the Flutter 3.47 project template).
android.newDsl=false
android.builtInKotlin=false
# Kotlin incremental compilation stores project-relative paths and breaks on Windows
# when the pub cache (C:) and the project live on different drives
# ("this and base files have different roots"). CI builds are clean anyway.
kotlin.incremental=false
