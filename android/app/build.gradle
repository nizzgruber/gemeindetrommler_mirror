plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    // (With android.builtInKotlin=false the Flutter plugin applies kotlin-android itself.)
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.oggauergemeindetrommler.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.oggauergemeindetrommler.app"
        // Flutter 3.47 defaults to 24; 23 (Android 6.0) is still supported and
        // is also the minimum required by the current Firebase Android SDKs.
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        // Read from pubspec.yaml (via local.properties); defaults to 1 / "1.0".
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            signingConfig signingConfigs.debug
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        dependsOn 'packageReleaseUniversalApk'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
