plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    // (With android.builtInKotlin=false the Flutter plugin applies kotlin-android itself.)
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace "com.oggauergemeindetrommler.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.oggauergemeindetrommler.app"
        // Flutter 3.47 defaults to 24; 23 (Android 6.0) is still supported and
        // is also the minimum required by the current Firebase Android SDKs.
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        // Read from pubspec.yaml (via local.properties); defaults to 1 / "1.0".
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }

    // `flutter build apk --split-per-abi` makes the Flutter Gradle plugin enable ABI
    // splits for the requested target platforms but switch the universal APK off.
    // Turn it back on so a single Gradle run yields the per-ABI APKs *and* the
    // universal one (the plugin copies all of them to build/app/outputs/flutter-apk/,
    // the universal one as app-release.apk). Only when splitting: for plain builds
    // the plugin sets ndk.abiFilters instead, which AGP does not allow together
    // with splits. Do not use AGP's `packageReleaseUniversalApk` task for this -
    // it derives the universal APK from an App Bundle, and bundles cannot be
    // built while ABI splits are enabled.
    if (project.findProperty("split-per-abi")?.toString()?.toBoolean()) {
        splits {
            abi {
                universalApk true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
