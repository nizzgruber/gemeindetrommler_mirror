name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# REPO-WEITE Gruppe (ohne github.ref!), damit sich ALLE Workflows dieses Repos
# gegenseitig ausschliessen. cancel-in-progress: false, weil der Runner capacity=1
# hat: Parallelitaet gibt es gar nicht, ein Build steht also sowieso in der Queue.
# "true" waer hier kontraproduktiv - es wuerde genau dann einen 30-60-min-QEMU-Build
# wegwerfen, wenn jemand nachlegt (und ein laufendes v*-Release haette verloren).
# Der alte Kommentar ("zwei parallele Builds killen den Runner") traf den Grund nicht:
# bei capacity=1 koennen nie zwei Jobs gleichzeitig laufen.
concurrency:
  group: ${{ github.repository }}-ci-queue
  cancel-in-progress: false

env:
  # Keep in sync with .github/workflows/build-ios.yaml and pubspec.yaml (environment).
  FLUTTER_VERSION: '3.47.4'
  # Static qemu-x86_64 for the ARM64 runner (Debian trixie `qemu-user`, see below).
  QEMU_DEB_VERSION: '10.0.13+ds-0+deb13u1'
  QEMU_DEB_SHA1: '02b553a4532192bc999d15408d1e56d7b254906f'
  # NEU: Fixierte Pfade fuer die Cache-Steps. actions/cache kann keine Shell-Var
  # ${FLUTTER_ROOT:-...} aus dem Image lesen (env-Context kennt nur Workflow-env),
  # deshalb stehen sie hier - identisch zu den Defaults, die unten im Code verwendet
  # werden. Der Guard-Step "Detect toolchain versions" bricht, falls das Image
  # davon abweicht, damit nie ein leerer Pfad als "Cache" gespeichert wird.
  FLUTTER_ROOT_PATH: /sdks/flutter
  ANDROID_SDK_PATH: /opt/android-sdk-linux

jobs:
  build-android:
    name: Build Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    container:
      # Cirrus Labs stopped publishing Flutter images in May 2026 (last tag: 3.44.0,
      # multi-arch amd64/arm64, Ubuntu 24.04, OpenJDK 21, Android SDK 36). The image is
      # only used for its JDK + Android SDK; the bundled Flutter SDK is switched to
      # FLUTTER_VERSION in the first step.
      image: ghcr.io/cirruslabs/flutter:3.44.0
      options: --privileged
    steps:
      # NEU an erster Stelle: das Job-Image (ghcr.io/cirruslabs/flutter) enthaelt KEIN
      # node - jede JS-basierte Action (checkout, cache) lauft sonst nach 0s mit
      # "exec: node: executable file not found" (Exit 126) ins Leere. In main steckte
      # die Node-Installation im selben Step wie das QEMU-Setup, das hier unten erst
      # nach den Caches laeuft; fuer Actions muss node aber vorher da sein. Deshalb ist
      # die Node-Installation als eigener, vorgelagerter Step abgetrennt.
      - name: Setup Node.js runtime for actions
        shell: bash
        run: |
          set -euo pipefail
          if command -v node >/dev/null 2>&1; then
            echo "node bereits vorhanden: $(node --version)"
          else
            ARCH="$(uname -m)"
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then NODE_ARCH="arm64"; else NODE_ARCH="x64"; fi
            curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-${NODE_ARCH}.tar.gz" \
              | tar -xzf - -C /usr/local --strip-components=1
            node --version
          fi

      - name: Switch Flutter SDK to pinned version
        # act_runner defaults to `sh -e` (dash); bash is needed for `pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="${FLUTTER_ROOT:-/sdks/flutter}"
          git config --global --add safe.directory "$FLUTTER_ROOT"
          git config --global --add safe.directory '*'
          CURRENT="$(git -C "$FLUTTER_ROOT" describe --tags --exact-match 2>/dev/null || true)"
          if [ "$CURRENT" != "$FLUTTER_VERSION" ]; then
            echo "Switching Flutter SDK from '${CURRENT:-unknown}' to '$FLUTTER_VERSION'"
            git -C "$FLUTTER_ROOT" fetch --depth 1 origin "refs/tags/${FLUTTER_VERSION}:refs/tags/${FLUTTER_VERSION}"
            git -C "$FLUTTER_ROOT" checkout -q "$FLUTTER_VERSION"
            # Drop the cache of the previous version; the Dart SDK and the engine
            # artifacts for the new version are downloaded on first use.
            rm -rf "$FLUTTER_ROOT/bin/cache"
          fi
          # NEU: das abschliessende `flutter --version` ist weg - es haette vor dem
          # Cache-Restore den Dart-SDK erneut geladen und damit den gerade
          # wiederhergestellten Cache teilweise ueberschrieben. Der naechste Step
          # plus "Inspect Build Environment" liefern denselben Nachweis.

      # NEU: Checkout jetzt direkt nach Node + SDK-Switch und VOR allen actions/cache-
      # Steps. Grund 1: actions/cache/restore braucht node (Vorstep). Grund 2: alle
      # Cache-Keys nutzen hashFiles(), das rechnet ausschliesslich gegen den Workspace
      # - ohne Checkout waere der Hash leer und der Key wuerde nie matchen.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect toolchain versions for cache keys
        # NEU: Cache-Keys duerfen nicht raten. Die NDK-Version haengt an der
        # Flutter-Version ab (FlutterExtension.kt) und wird hier bestimmt, damit der
        # SDK-Cache unten exakt auf diesen Stand gematcht wird.
        # sdk_cache='off' (nur Warnung, kein Abbruch!) wenn das Image andere Pfade
        # nutzt als die fixierten Cache-Pfade: dann bleibt der Build lauffaehig wie
        # vorher, nur der SDK-Cache-Step wird uebersprungen statt ins Leere zu cachen.
        id: tk
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="${FLUTTER_ROOT:-$FLUTTER_ROOT_PATH}"
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_PATH}"
          SDK_CACHE=on
          if [ "$FLUTTER_ROOT" != "$FLUTTER_ROOT_PATH" ] || [ "$ANDROID_SDK" != "$ANDROID_SDK_PATH" ]; then
            echo "::warning::Image-Pfade (FLUTTER_ROOT=$FLUTTER_ROOT, ANDROID_HOME=$ANDROID_SDK) weichen von den Cache-Pfaeden ab - SDK-Cache-Step wird uebersprungen. Bitte FLUTTER_ROOT_PATH/ANDROID_SDK_PATH und path: anpassen."
            SDK_CACHE=off
          fi
          FLUTTER_EXT="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          [ -f "$FLUTTER_EXT" ] || { echo "::error::Flutter-SDK nicht gefunden: $FLUTTER_ROOT"; exit 1; }
          NDK_VERSION="$(sed -nE 's/.*ndkVersion: String = "([^"]+)".*/\1/p' "$FLUTTER_EXT")"
          [ -n "$NDK_VERSION" ] || { echo "::error::Could not determine Flutter's NDK version"; exit 1; }
          echo "flutter=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "sdk_cache=$SDK_CACHE" >> "$GITHUB_OUTPUT"
          echo "Cache-Key-Bestandteile: flutter=$FLUTTER_VERSION ndk=$NDK_VERSION sdk_cache=$SDK_CACHE"

      # ---- Caches -------------------------------------------------------------
      # Alle drei Entries sind so gebaut, dass ein Cache-Fehlschlag den Build NICHT
      # kaputtmacht: actions/cache ist bei Miss neutral (Restore ist ein no-op, der
      # Build laedt alles einfach neu). Bewusst KEIN continues-on-error/|| true, weil
      # sonst ein defekter Cache-Service dauerhaft unsichtbar bliebe.
      # Keys enthalten immer OS+Arch, damit ein x86-Runner niemals einen arm64-Stand
      # zurueckbekommt (und umgekehrt).

      - name: Cache pub packages
        # ~/.pub-cache: Inhalt ist pro Paketversion unveraenderlich, deshalb sind die
        # gestaffelten restore-keys gefahrlos (alt + neu gemischt = nur mehr Pakete).
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pubcache-${{ runner.os }}-${{ runner.arch }}-flutter${{ steps.tk.outputs.flutter }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pubcache-${{ runner.os }}-${{ runner.arch }}-flutter${{ steps.tk.outputs.flutter }}-
            pubcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Gradle caches and wrapper
        # ~/.gradle/caches (modules-2 + transforms) und ~/.gradle/wrapper/dists
        # (Gradle- Distribution, hier 9.3.1 - 200 MB, wandern sonst jeden Lauf neu).
        # pubspec.lock ist Teil des Keys, weil die Gradle-Dateien der Flutter-Plugins
        # im pub-cache liegen und hashFiles() sie nicht sieht: pubspec.lock ist der
        # beste Proxy fuer "Android-Abhaengigkeiten haben sich geaendert".
        # Teil-Treffer sind unkritisch: Gradle verifiziert seine Metadaten selbst und
        # laedt Fehlendes nach.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'android/**/*.gradle', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Flutter SDK bin cache
        # Das ist der teure Teil: durch den Versionsswitch oben wird bin/cache jedes
        # Lauf geloescht, Dart-SDK + Engine-Artefakte (~0,5-1 GB) luden bisher jeden
        # Lauf neu. Eigener Entry (nicht mit dem NDK kombiniert), weil actions/cache
        # einen bestehenden Key NICHT aktualisiert: gemischte Eintraege wuerden als
        # halbvoller Stand dauerhaft verloren sein.
        # EXAKTER Key inkl. Flutter-Version, restore-Key enthaelt zwingend die
        # Flutter-Version - ein SDK-Fremdstand waere ein stiller Fehlbuild.
        if: steps.tk.outputs.sdk_cache == 'on'
        uses: actions/cache@v4
        with:
          path: |
            /sdks/flutter/bin/cache
          key: sdk-${{ runner.os }}-${{ runner.arch }}-flutter${{ steps.tk.outputs.flutter }}-binCache
          restore-keys: |
            sdk-${{ runner.os }}-${{ runner.arch }}-flutter${{ steps.tk.outputs.flutter }}-binCache

      - name: Cache Android NDK
        # Das NDK (~1-2 GB) installierte bisher JEDER Lauf ueber sdkmanager neu.
        # Key haengt an Flutter- UND NDK-Version; restore Keys enthalten beide,
        # damit nie ein NDK eines anderen Flutter-Stands in den Build rotaeiert.
        # Wird der NDK im Lauf nicht installiert (andere Architektur), Speichert der
        # Post-Step nichts - das ist ein Warnung, kein Fehler.
        if: steps.tk.outputs.sdk_cache == 'on'
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk-linux/ndk
          key: ndk-${{ runner.os }}-${{ runner.arch }}-flutter${{ steps.tk.outputs.flutter }}-ndk${{ steps.tk.outputs.ndk }}
          restore-keys: |
            ndk-${{ runner.os }}-${{ runner.arch }}-flutter${{ steps.tk.outputs.flutter }}-ndk

      # Umgetauft, und die Node-Installation ist nach oben vorgezogen (siehe erster
      # Step): dieser Step macht jetzt nur noch das QEMU-/Engine-Setup. Er laeuft
      # bewusst NACH den Cache-Restores, damit `flutter precache --android` und die
      # NDK-Installation in die wiederhergestellten Cache-Verzeichnisse schreiben,
      # statt sie kurz danach wieder zu ueberschreiben.
      - name: Setup QEMU x86_64 Emulation & ARM64 Flutter Engine
        run: |
          ARCH=$(uname -m)

          # On Linux ARM64, Flutter engine and Android AAPT2 need x86_64 emulation via QEMU.
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            echo "Setting up ARM64 Flutter environment & QEMU binfmt emulation..."
            apt-get update -qq && apt-get install -y -qq qemu-user-static binfmt-support libc6-amd64-cross libstdc++6-amd64-cross gcc llvm

            # Setup x86_64 dynamic libraries & prefix for QEMU emulation
            mkdir -p /etc/qemu-binfmt
            ln -sf /usr/x86_64-linux-gnu /etc/qemu-binfmt/x86_64
            mkdir -p /lib64 /usr/lib64
            ln -sf /usr/x86_64-linux-gnu/lib/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
            ln -sf /usr/x86_64-linux-gnu/lib/* /lib64/ 2>/dev/null || true
            ln -sf /usr/x86_64-linux-gnu/lib/* /usr/lib64/ 2>/dev/null || true

            export QEMU_LD_PREFIX=/usr/x86_64-linux-gnu
            echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"

            # Ubuntu 24.04 ships QEMU 8.2.2, whose x86_64 user-mode emulation dies with
            # "QEMU internal SIGSEGV {code=MAPERR, addr=0x20}" as soon as the guest calls
            # pthread_getattr_np() - which Dart's gen_snapshot does since Flutter 3.4x
            # (https://gitlab.com/qemu-project/qemu/-/issues/2170, fixed in 8.2.3/9.0).
            # Replace it with the static binary from Debian trixie's qemu-user package.
            QEMU_DEB="qemu-user_${QEMU_DEB_VERSION}_arm64.deb"
            curl -fsSL -o /tmp/qemu-user.deb "https://deb.debian.org/debian/pool/main/q/qemu/${QEMU_DEB}" ||
              curl -fsSL -o /tmp/qemu-user.deb "https://snapshot.debian.org/file/${QEMU_DEB_SHA1}"
            echo "${QEMU_DEB_SHA1}  /tmp/qemu-user.deb" | sha1sum -c -
            dpkg-deb -x /tmp/qemu-user.deb /tmp/qemu-user
            install -m 0755 /tmp/qemu-user/usr/bin/qemu-x86_64 /usr/bin/qemu-x86_64-static
            rm -rf /tmp/qemu-user /tmp/qemu-user.deb
            /usr/bin/qemu-x86_64-static --version | head -n 1

            # Must match the path hard-coded in scripts/ci/qemu_intercept.c.
            QEMU_BIN=/usr/bin/qemu-x86_64-static

            # Dummy fallbacks for FEX binaries/sockets
            for fex in /usr/bin/FEXInterpreter /usr/bin/FEX /usr/local/bin/FEXInterpreter /usr/bin/FEXServer /usr/local/bin/FEXServer; do
              printf '#!/bin/sh\nexit 0\n' > "$fex"
              chmod +x "$fex" 2>/dev/null || true
            done

            flutter precache --android
            # Flutter (still) only ships an x86_64 gen_snapshot for Linux hosts; wrap it
            # with QEMU under the linux-arm64 path the tool expects.
            for dir in "${FLUTTER_ROOT:-/sdks/flutter}"/bin/cache/artifacts/engine/android-*; do
              if [ -d "$dir/linux-x64" ] && [ ! -x "$dir/linux-arm64/gen_snapshot" ]; then
                mkdir -p "$dir/linux-arm64"
                printf '#!/bin/sh\nSCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"\nexec env -u LD_PRELOAD %s -L /usr/x86_64-linux-gnu "$SCRIPT_DIR/../linux-x64/gen_snapshot" "$@"\n' "$QEMU_BIN" > "$dir/linux-arm64/gen_snapshot"
                chmod +x "$dir/linux-arm64/gen_snapshot"
                echo "Configured gen_snapshot wrapper for $(basename "$dir")"
              fi
            done

            # AGP strips libflutter.so/libapp.so with the NDK's llvm-strip; unstripped they
            # are ~15x larger (165 MB instead of 12 MB per ABI). The NDK's x86_64 llvm-strip
            # cannot run under QEMU (needs libz.so.1 etc. in the cross sysroot), so install
            # the NDK Flutter expects up front and swap in Ubuntu's native arm64 llvm-strip.
            # NEU: der Block ist idempotent geworden, weil das NDK jetzt aus dem Cache
            # kommen kann - ohne diese beiden Falls waere der zweite Lauf kaputt
            # (`mv` findet die bereits umbenannte Datei nicht).
            NDK_VERSION="${{ steps.tk.outputs.ndk }}"
            [ -n "$NDK_VERSION" ] || { echo "::error::Could not determine Flutter's NDK version"; exit 1; }
            NDK_BIN="${ANDROID_HOME:-/opt/android-sdk-linux}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [ -d "$NDK_BIN" ]; then
              echo "NDK $NDK_VERSION vorhanden (Cache-Hit) - sdkmanager wird uebersprungen"
            else
              echo "Installing NDK $NDK_VERSION ..."
              yes | sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null
            fi
            for tool in llvm-strip llvm-objcopy; do
              if [ ! -f "$NDK_BIN/$tool.x86_64" ] && [ -f "$NDK_BIN/$tool" ]; then
                mv "$NDK_BIN/$tool" "$NDK_BIN/$tool.x86_64"
              fi
              ln -sf "$(command -v "$tool")" "$NDK_BIN/$tool"
            done
            "$NDK_BIN/llvm-strip" --version | head -n 2
          fi

      - name: Setup QEMU Interceptor
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            echo "Compiling transparent QEMU execution interceptor..."
            gcc -O2 -shared -fPIC -o /usr/local/lib/libqemu_intercept.so scripts/ci/qemu_intercept.c -ldl
            echo "LD_PRELOAD=/usr/local/lib/libqemu_intercept.so" >> "$GITHUB_ENV"
            rm -f /etc/ld.so.preload
            echo "Enabled LD_PRELOAD interceptor via GITHUB_ENV"
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Inspect Build Environment
        run: |
          flutter --version
          java -version
          node --version

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Run Code Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Release APKs (Split-per-ABI + Universal)
        # android/app/build.gradle re-enables the universal APK for split builds, so
        # this one Gradle run yields all four APKs in build/app/outputs/flutter-apk/.
        run: flutter build apk --release --split-per-abi

      - name: Organize Artifacts
        run: |
          mkdir -p release-apks
          APK_DIR=build/app/outputs/flutter-apk
          echo "=== Flutter APK outputs ==="
          ls -lah "$APK_DIR"
          cp "$APK_DIR/app-release.apk"              release-apks/oggauer-gemeindetrommler-universal.apk
          cp "$APK_DIR/app-arm64-v8a-release.apk"    release-apks/oggauer-gemeindetrommler-arm64-v8a.apk
          cp "$APK_DIR/app-armeabi-v7a-release.apk"  release-apks/oggauer-gemeindetrommler-armeabi-v7a.apk
          cp "$APK_DIR/app-x86_64-release.apk"       release-apks/oggauer-gemeindetrommler-x86_64.apk
          echo "=== Generated APK Artifacts ==="
          ls -lah release-apks/

      # v3 -> v4: Gitea 1.27 bedient die v4-Artifact-API nativ. v3 ist gegen die
      # v4-API inkompatibel (anderer Upload-Endpunkt/Andockung) und lief hier nur,
      # weil der Runner beide Backends anbietet - aufwaerts kompatibel bleibt v4.
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: oggauer-gemeindetrommler-universal
          path: release-apks/oggauer-gemeindetrommler-universal.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: oggauer-gemeindetrommler-arm64-v8a
          path: release-apks/oggauer-gemeindetrommler-arm64-v8a.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: oggauer-gemeindetrommler-armeabi-v7a
          path: release-apks/oggauer-gemeindetrommler-armeabi-v7a.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: oggauer-gemeindetrommler-x86_64
          path: release-apks/oggauer-gemeindetrommler-x86_64.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish Direct APKs to Gitea Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: latest
        run: |
          node scripts/ci/publish_release.js

      - name: Clean Workspace Disk Space
        if: always()
        run: |
          rm -rf build android/.gradle release-apks 2>/dev/null || true
