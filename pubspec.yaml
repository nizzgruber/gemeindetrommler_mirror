name: oggauergemeindetrommler
description: Gemeinde Trommler

# Private app – never publish to pub.dev.
publish_to: 'none'

# Version + build number (build-name+build-number). Can be overridden with
# `flutter build ... --build-name --build-number`.
version: 0.0.1

environment:
  # Flutter 3.47.x ships Dart 3.13; keep the constraint in sync with the
  # Flutter version pinned in the CI workflows (FLUTTER_VERSION).
  sdk: ^3.11.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Auth, Firestore, Storage)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # UI / state
  provider: ^6.1.5
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  intl: ^0.20.2

  # Media
  image_picker: ^1.2.3
  image: ^4.5.4

  # PDF export & sharing
  pdf: ^3.11.3
  printing: ^5.14.3

  # Misc
  http: ^1.2.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

  # Transitive (via flutter_cache_manager / printing), pinned on purpose:
  # path_provider_android >= 2.3 is implemented with `jni` and compiles native
  # code (CMake + NDK). The ARM64 Gitea runner would have to run the x86_64 NDK
  # toolchain through QEMU, so stay on the pure-Java implementation for now.
  path_provider_android: '>=2.2.0 <2.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
